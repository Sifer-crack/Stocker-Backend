# infra/ingress/nginx.conf
#
# PLACEHOLDER — reverse proxy / TLS termination in front of the gateway.
# Not wired into docker-compose yet. Intended for a later prod-like profile.
#
# TODO: mount certs, proxy header config (X-Forwarded-*), rate limiting.

events {}

http {
  server {
    listen 80;
    server_name stocker.local;

    # Service-to-service callbacks (e.g. shopping -> gateway) must never be reachable from outside.
    location /internal/ {
      return 404;
    }

    location / {
      proxy_pass http://gateway:8080;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }
}
