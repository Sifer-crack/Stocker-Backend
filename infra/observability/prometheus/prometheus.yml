global:
  scrape_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: services
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - gateway:8080
          - identity:8081
          - catalog:8082
          - shopping:8083
          - pricing:8084
          - notifications:8085
          - analytics:8086

  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8889"]
