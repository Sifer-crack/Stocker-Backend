# Resource caps for running the whole stack on a developer machine: at most 8 GiB of RAM and 6 CPU cores in total.
# Used automatically by scripts/manual-test/stack-up.sh (set STACK_LIMITS=off to run without it).
#
# RAM (MiB): gateway/identity/catalog/shopping/inventory/notifications 640 each = 3840, analytics 384, pricing 2304
# (the JVM heap plus headless Firefox for the crawl), kafka 1024, kafka-init 256  ->  7808 MiB (7.6 GiB), under 8 GiB.
# CPU: every container is pinned to cores 0-5 (six cores). The JVMs size their heap from the container limit.
x-jvm: &jvm
  JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=65 -XX:+UseSerialGC -Xss512k"

services:
  kafka:
    mem_limit: 1024m
    cpuset: "0-5"
    environment:
      KAFKA_HEAP_OPTS: "-Xms256m -Xmx512m"
  kafka-init:
    mem_limit: 256m
    cpuset: "0-5"
  gateway:
    mem_limit: 640m
    cpuset: "0-5"
    environment: *jvm
  identity:
    mem_limit: 640m
    cpuset: "0-5"
    environment: *jvm
  catalog:
    mem_limit: 640m
    cpuset: "0-5"
    environment: *jvm
  shopping:
    mem_limit: 640m
    cpuset: "0-5"
    environment: *jvm
  inventory:
    mem_limit: 640m
    cpuset: "0-5"
    environment: *jvm
  notifications:
    mem_limit: 640m
    cpuset: "0-5"
    environment: *jvm
  analytics:
    mem_limit: 384m
    cpuset: "0-5"
    environment: *jvm
  pricing:
    mem_limit: 2304m
    shm_size: 256m          # headless Firefox needs more than the 64 MiB default shared memory
    cpuset: "0-5"
    environment:
      # a smaller heap than the other services: the rest of the limit is for Firefox when the crawl is on
      JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=40 -XX:+UseSerialGC -Xss512k"
