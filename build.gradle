plugins {
	id 'java'
	alias(libs.plugins.spring.boot) apply false
	alias(libs.plugins.dependency.management) apply false
}

group = 'com.stocker'
version = '0.0.1-SNAPSHOT'

subprojects {
	apply plugin: 'java'
	apply plugin: 'io.spring.dependency-management'
	if (project.name != 'services') {
		apply plugin: 'org.springframework.boot'
	}

	group = 'com.stocker'
	version = '0.0.1-SNAPSHOT'

	java {
		toolchain {
			languageVersion = JavaLanguageVersion.of(25)
		}
	}

	repositories {
		mavenCentral()
	}

	dependencyManagement {
		imports {
			mavenBom "org.springframework.cloud:spring-cloud-dependencies:${libs.versions.spring.cloud.get()}"
		}
	}


	dependencies {
		implementation 'io.github.cdimascio:dotenv-java:3.2.0'
	}

	tasks.named('test') {
		useJUnitPlatform()
	}

	// Test layers (see docs/testing.md). `test` runs everything offline; these run one tagged layer only.
	['service', 'feature-integration'].each { layer ->
		tasks.register(layer == 'service' ? 'serviceTest' : 'featureIntegrationTest', Test) {
			description = "Runs only tests tagged @Tag(\"${layer}\")."
			group = 'verification'
			testClassesDirs = sourceSets.test.output.classesDirs
			classpath = sourceSets.test.runtimeClasspath
			useJUnitPlatform {
				includeTags layer
			}
		}
	}
}
