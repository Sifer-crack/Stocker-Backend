name: stocker

services:
  # --- infrastructure ---

  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: stocker
      POSTGRES_PASSWORD: stocker
      POSTGRES_DB: stocker
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stocker -d stocker"]
      interval: 10s
      timeout: 5s
      retries: 5

  mongo:
    image: mongo:8
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka:
    image: apache/kafka:4.3.1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:29092,CONTROLLER://:9093,PLAINTEXT_HOST://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    ports:
      - "9092:9092"
    volumes:
      - kafka-data:/tmp/kraft-combined-logs
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s

  kafka-init:
    image: apache/kafka:4.3.1
    entrypoint: ["/bin/bash", "/opt/kafka-init.sh"]
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    volumes:
      - ./infra/kafka/kafka-init.sh:/opt/kafka-init.sh:ro
    depends_on:
      kafka:
        condition: service_healthy
    restart: "no"

  # --- application services ---

  gateway:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    environment:
      SERVER_PORT: 8080
      STOCKER_JWT_SECRET: ${STOCKER_JWT_SECRET}
      STOCKER_CORS_ALLOWED_ORIGINS: ${STOCKER_CORS_ALLOWED_ORIGINS:-http://localhost:5173}
    ports:
      - "8080:8080"
    depends_on:
      - identity

  # identity talks to Neon (see .env.example), not the local postgres below —
  # so it waits on kafka only. catalog/shopping still use local postgres.
  identity:
    build:
      context: .
      dockerfile: services/identity/Dockerfile
    environment:
      SERVER_PORT: 8081
      STOCKER_DB_URL: ${IDENTITY_DB_URL}
      STOCKER_DB_USER: ${IDENTITY_DB_USER}
      STOCKER_DB_PASSWORD: ${IDENTITY_DB_PASSWORD}
      # Neon tables already exist and are managed in Neon directly —
      # the app must never run Flyway migrations against them.
      SPRING_FLYWAY_ENABLED: "false"
      STOCKER_JWT_SECRET: ${STOCKER_JWT_SECRET}
      STOCKER_CORS_ALLOWED_ORIGINS: ${STOCKER_CORS_ALLOWED_ORIGINS:-http://localhost:5173}
      STOCKER_AUTH_COOKIE_SECURE: ${STOCKER_AUTH_COOKIE_SECURE:-false}
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    ports:
      - "8081:8081"
    depends_on:
      kafka:
        condition: service_healthy

  catalog:
    build:
      context: .
      dockerfile: services/catalog/Dockerfile
    environment:
      SERVER_PORT: 8082
      STOCKER_DB_URL: jdbc:postgresql://postgres:5432/catalog
      STOCKER_DB_USER: stocker
      STOCKER_DB_PASSWORD: stocker
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    ports:
      - "8082:8082"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy

  shopping:
    build:
      context: .
      dockerfile: services/shopping/Dockerfile
    environment:
      SERVER_PORT: 8083
      STOCKER_DB_URL: jdbc:postgresql://postgres:5432/shopping
      STOCKER_DB_USER: stocker
      STOCKER_DB_PASSWORD: stocker
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    ports:
      - "8083:8083"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy

  pricing:
    build:
      context: .
      dockerfile: services/pricing/Dockerfile
    environment:
      SERVER_PORT: 8084
      STOCKER_MONGO_URI: mongodb://mongo:27017/pricing
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    ports:
      - "8084:8084"
    depends_on:
      mongo:
        condition: service_healthy
      kafka:
        condition: service_healthy

  notifications:
    build:
      context: .
      dockerfile: services/notifications/Dockerfile
    environment:
      SERVER_PORT: 8085
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    ports:
      - "8085:8085"
    depends_on:
      kafka:
        condition: service_healthy

  analytics:
    build:
      context: .
      dockerfile: services/analytics/Dockerfile
    environment:
      SERVER_PORT: 8086
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    ports:
      - "8086:8086"
    depends_on:
      kafka:
        condition: service_healthy

volumes:
  postgres-data:
  mongo-data:
  kafka-data:
