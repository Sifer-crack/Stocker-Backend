# Neon-backed auth stack.
# Auto-loaded by `docker compose` alongside docker-compose.yml.
# Overrides environment for gateway + identity ONLY — all other services,
# ports, volumes, and healthchecks stay exactly as defined in the base file.
#
# identity keeps its base-file depends_on (postgres, kafka): the local
# postgres container will still start and go healthy, but identity ignores
# it and talks to Neon instead.
services:
  gateway:
    environment:
      SERVER_PORT: 8080
      STOCKER_JWT_SECRET: ${STOCKER_JWT_SECRET}
      STOCKER_CORS_ALLOWED_ORIGINS: ${STOCKER_CORS_ALLOWED_ORIGINS:-http://localhost:5173}

  identity:
    # Local postgres is not part of this stack (identity talks to Neon),
    # so reset the base file's depends_on (postgres, kafka) to kafka only.
    depends_on: !reset
      kafka:
        condition: service_healthy
    environment:
      SERVER_PORT: 8081
      STOCKER_DB_URL: ${IDENTITY_DB_URL}
      STOCKER_DB_USER: ${IDENTITY_DB_USER}
      STOCKER_DB_PASSWORD: ${IDENTITY_DB_PASSWORD}
      # Neon tables already exist and are managed in Neon directly —
      # the app must never run Flyway migrations against them.
      SPRING_FLYWAY_ENABLED: "false"
      STOCKER_JWT_SECRET: ${STOCKER_JWT_SECRET}
      STOCKER_CORS_ALLOWED_ORIGINS: ${STOCKER_CORS_ALLOWED_ORIGINS:-http://localhost:5173}
      STOCKER_AUTH_COOKIE_SECURE: ${STOCKER_AUTH_COOKIE_SECURE:-false}
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
