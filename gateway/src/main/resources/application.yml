spring:
  application:
    name: gateway
  cloud:
    gateway:
      server:
        webflux:
          routes: []
          # TODO: define real routes once services expose HTTP APIs, e.g.:
          # - id: identity
          #   uri: http://identity:8081
          #   predicates:
          #     - Path=/api/identity/**
  grpc:
    client:
      default-channel:
        address: ${STOCKER_GRPC_DEFAULT_ADDRESS:localhost:9090}
      channels:
        identity:
          address: ${STOCKER_GRPC_IDENTITY_ADDRESS:dns:///localhost:9090}

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
