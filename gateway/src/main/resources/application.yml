spring:
  application:
    name: gateway
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: identity
              uri: http://identity:8081
              predicates:
                - Path=/api/identity/**
              filters:
                - StripPrefix=1
                # The gateway is the single CORS enforcement point: strip the
                # browser's CORS headers before proxying so identity never
                # stamps a second Access-Control-Allow-* set on the response.
                - RemoveRequestHeader=Origin
                - RemoveRequestHeader=Access-Control-Request-Method
                - RemoveRequestHeader=Access-Control-Request-Headers
            - id: catalog
              uri: http://catalog:8082
              predicates:
                - Path=/api/products/**
              filters:
                - StripPrefix=1
                - RemoveRequestHeader=Origin
                - RemoveRequestHeader=Access-Control-Request-Method
                - RemoveRequestHeader=Access-Control-Request-Headers

            - id: inventory
              uri: http://inventory:8087
              predicates:
                - Path=/api/pantry-items/**
              filters:
                - StripPrefix=1
                - RemoveRequestHeader=Origin
                - RemoveRequestHeader=Access-Control-Request-Method
                - RemoveRequestHeader=Access-Control-Request-Headers
            - id: notifications
              uri: http://notifications:8085
              predicates:
                - Path=/api/notifications/**
              filters:
                - StripPrefix=1
                - RemoveRequestHeader=Origin
                - RemoveRequestHeader=Access-Control-Request-Method
                - RemoveRequestHeader=Access-Control-Request-Headers

            # Shopping list: /api/shopping/items -> shopping /shopping/items. The user is identified
            # by X-User-Id, set by JwtClaimForwardFilter from the verified JWT. Comparison results
            # come back to the browser over GET /api/updates/shopping (ShoppingUpdatesController),
            # deliberately not under this prefix.
            - id: shopping
              uri: http://shopping:8083
              predicates:
                - Path=/api/shopping/**
              filters:
                - StripPrefix=1
                - RemoveRequestHeader=Origin
                - RemoveRequestHeader=Access-Control-Request-Method
                - RemoveRequestHeader=Access-Control-Request-Headers

  grpc:
    client:
      default-channel:
        address: ${STOCKER_GRPC_DEFAULT_ADDRESS:localhost:9090}
      channels:
        identity:
          address: ${STOCKER_GRPC_IDENTITY_ADDRESS:dns:///localhost:9090}
        pricing:
          address: ${STOCKER_GRPC_PRICING_ADDRESS:dns:///localhost:9094}

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus

app:
  cors:
    # Comma-separated allowed origins for browser-based clients; the ONLY CORS configuration (SecurityConfig).
    # Credentials (the refresh cookie) are allowed, so never put "*" here.
    allowed-origins: ${STOCKER_CORS_ALLOWED_ORIGINS:http://localhost:5173}
  pricing:
    # Deadline for every gRPC call to pricing, so a hung pricing cannot pin a thread (ISO-8601 duration).
    deadline: ${STOCKER_PRICING_DEADLINE:PT10S}
stocker:
  jwt:
    # No default on purpose: the gateway refuses to start without the shared secret (at least 32 bytes).
    secret: ${STOCKER_JWT_SECRET}
  internal:
    # Shared secret for service-to-service callbacks (shopping -> POST /internal/shopping/updates).
    # Must match shopping's STOCKER_INTERNAL_TOKEN. No default on purpose: the gateway refuses to start without it.
    token: ${STOCKER_INTERNAL_TOKEN}
