spring:
  application:
    name: gateway
  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins: ${STOCKER_CORS_ALLOWED_ORIGINS:http://localhost:5173}
            allowedMethods: "*"
            allowedHeaders: "*"
            allowCredentials: true
            maxAge: 3600
      server:
        webflux:
          routes:
            - id: identity
              uri: http://identity:8081
              predicates:
                - Path=/api/identity/**
              filters:
                - StripPrefix=1
  grpc:
    client:
      default-channel:
        address: ${STOCKER_GRPC_DEFAULT_ADDRESS:localhost:9090}
      channels:
        identity:
          address: ${STOCKER_GRPC_IDENTITY_ADDRESS:dns:///localhost:9090}

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus

stocker:
  jwt:
    secret: ${STOCKER_JWT_SECRET:dev-only-32-byte-minimum-secret-0123456789}
