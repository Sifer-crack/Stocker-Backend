spring:
  application:
    name: gateway
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: identity
              uri: http://identity:8081
              predicates:
                - Path=/api/identity/**
              filters:
                - StripPrefix=1
                # The gateway is the single CORS enforcement point: strip the
                # browser's CORS headers before proxying so identity never
                # stamps a second Access-Control-Allow-* set on the response.
                - RemoveRequestHeader=Origin
                - RemoveRequestHeader=Access-Control-Request-Method
                - RemoveRequestHeader=Access-Control-Request-Headers
            - id: catalog
              uri: http://catalog:8082
              predicates:
                - Path=/api/products/**
              filters:
                - StripPrefix=1
                - RemoveRequestHeader=Origin
                - RemoveRequestHeader=Access-Control-Request-Method
                - RemoveRequestHeader=Access-Control-Request-Headers

  grpc:
    client:
      default-channel:
        address: ${STOCKER_GRPC_DEFAULT_ADDRESS:localhost:9090}
      channels:
        identity:
          address: ${STOCKER_GRPC_IDENTITY_ADDRESS:dns:///localhost:9090}
        pricing:
          address: ${STOCKER_GRPC_PRICING_ADDRESS:dns:///localhost:9094}

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus

app:
  cors:
    # Comma-separated allowed origins for browser-based clients. No auth/credentials are sent
    # cross-origin yet (auth is being built separately on identity), so allowCredentials is off.
    allowed-origins: ${STOCKER_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
stocker:
  jwt:
    secret: ${STOCKER_JWT_SECRET:dev-only-32-byte-minimum-secret-0123456789}
