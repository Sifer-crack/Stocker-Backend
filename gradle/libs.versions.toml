[versions]
spring-boot = "4.0.7"
spring-cloud = "2025.1.2"
spring-grpc = "1.0.3"
dependency-management-plugin = "1.1.7"
protobuf-plugin = "0.9.4"
protoc = "3.25.9"
grpc = "1.83.1"
playwright = "1.63.0"
javax-annotation-api = "1.3.2"

[libraries]
# Spring Boot starters - version resolved via the Spring Boot BOM (org.springframework.boot plugin)
spring-boot-starter-webmvc = { module = "org.springframework.boot:spring-boot-starter-webmvc" }
spring-boot-starter-webflux = { module = "org.springframework.boot:spring-boot-starter-webflux" }
spring-boot-starter-actuator = { module = "org.springframework.boot:spring-boot-starter-actuator" }
spring-boot-starter-data-jpa = { module = "org.springframework.boot:spring-boot-starter-data-jpa" }
spring-boot-starter-validation = { module = "org.springframework.boot:spring-boot-starter-validation" }
spring-boot-starter-kafka = { module = "org.springframework.boot:spring-boot-starter-kafka" }
spring-boot-starter-webmvc-test = { module = "org.springframework.boot:spring-boot-starter-webmvc-test" }
spring-boot-starter-webflux-test = { module = "org.springframework.boot:spring-boot-starter-webflux-test" }

# Spring Cloud - version resolved via the spring-cloud-dependencies BOM
spring-cloud-dependencies = { module = "org.springframework.cloud:spring-cloud-dependencies", version.ref = "spring-cloud" }
spring-cloud-starter-gateway-server-webflux = { module = "org.springframework.cloud:spring-cloud-starter-gateway-server-webflux" }

# Spring gRPC - version resolved via the spring-grpc-dependencies platform BOM
spring-grpc-dependencies = { module = "org.springframework.grpc:spring-grpc-dependencies", version.ref = "spring-grpc" }
spring-grpc-client-starter = { module = "org.springframework.grpc:spring-grpc-client-spring-boot-starter" }
spring-grpc-server-starter = { module = "org.springframework.grpc:spring-grpc-server-spring-boot-starter" }

# Raw gRPC/protobuf - not BOM-managed, pinned explicitly (see AGENTS.md)
grpc-netty-shaded = { module = "io.grpc:grpc-netty-shaded", version.ref = "grpc" }
grpc-protobuf = { module = "io.grpc:grpc-protobuf", version.ref = "grpc" }
grpc-stub = { module = "io.grpc:grpc-stub", version.ref = "grpc" }
javax-annotation-api = { module = "javax.annotation:javax.annotation-api", version.ref = "javax-annotation-api" }

# Ingest module
playwright = { module = "com.microsoft.playwright:playwright", version.ref = "playwright" }

# Persistence / observability - version resolved via the Spring Boot BOM
# Spring Boot 4 split Flyway autoconfiguration into its own module (like spring-boot-hibernate,
# spring-boot-jdbc, ...) - flyway-database-postgresql alone no longer triggers it.
spring-boot-flyway = { module = "org.springframework.boot:spring-boot-flyway" }
flyway-database-postgresql = { module = "org.flywaydb:flyway-database-postgresql" }
postgresql = { module = "org.postgresql:postgresql" }
micrometer-registry-prometheus = { module = "io.micrometer:micrometer-registry-prometheus" }

# Lombok - version resolved via the Spring Boot BOM
lombok = { module = "org.projectlombok:lombok" }

# Spring Boot 4's spring-boot-jackson autoconfigures Jackson 3 (tools.jackson.databind.ObjectMapper)
# as the primary ObjectMapper bean, not the classic com.fasterxml.jackson.databind.ObjectMapper
# this codebase's Jackson-2-based code depends on - see infrastructure/config/JacksonConfig.
jackson-datatype-jsr310 = { module = "com.fasterxml.jackson.datatype:jackson-datatype-jsr310" }

[plugins]
spring-boot = { id = "org.springframework.boot", version.ref = "spring-boot" }
dependency-management = { id = "io.spring.dependency-management", version.ref = "dependency-management-plugin" }
protobuf = { id = "com.google.protobuf", version.ref = "protobuf-plugin" }
