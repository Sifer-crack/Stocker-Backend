spring:
  application:
    name: identity
  lifecycle:
    timeout-per-shutdown-phase: 10s
  datasource:
    url: ${STOCKER_DB_URL:jdbc:postgresql://localhost:5432/identity}
    username: ${STOCKER_DB_USER:stocker}
    password: ${STOCKER_DB_PASSWORD:stocker}
    hikari:
      maximum-pool-size: 10
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: stocker.identity
      enable-auto-commit: false
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

server:
  port: ${SERVER_PORT:8081}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus

app:
  kafka:
    producer:
      topics:
        household: stocker.household.events.v1
    consumer:
      topics: stocker.household.events.v1

stocker:
  jwt:
    secret: ${STOCKER_JWT_SECRET:dev-only-32-byte-minimum-secret-0123456789}
    access-ttl-seconds: ${STOCKER_JWT_ACCESS_TTL:900}
    refresh-ttl-seconds: ${STOCKER_JWT_REFRESH_TTL:604800}
