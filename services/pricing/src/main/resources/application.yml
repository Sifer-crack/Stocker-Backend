  # domain/port/EventPublisher + infrastructure/messaging/KafkaEventPublisher publish to the
  # `pricing` topic below on every price capture (on-demand and async refresh).
  # TODO: consuming stocker.catalog.events.v1 (application/PricingEventService +
  # infrastructure/messaging/KafkaEventConsumer) is still unimplemented — the generic
  # infrastructure/config/KafkaConsumerConfig listener below is a stub only.
  kafka:
    producer:
      topics:
        promotions: stocker.promotions.events.v1
        pricing: stocker.pricing.events.v1
    consumer:
      topics: stocker.catalog.events.v1
  normalize:
    # Normalises price_records rows that predate normalized_products (database work only, no requests).
    backfill-on-startup: ${STOCKER_NORMALIZE_BACKFILL:true}
    # Re-derives canonical_key / pack size / unit price of stored rows with the current catalog (database work only,
    # writes only rows that changed). Runs once after the backfill.
    rekey-on-startup: ${STOCKER_NORMALIZE_REKEY:true}
  pricing:
    # Freshness check before prices are shown: for a common product whose stored prices are older than
    # stale-after, load only that product's category page on the stale chains (see OnDemandRefreshService).
    on-demand:
      enabled: ${STOCKER_PRICING_ON_DEMAND_ENABLED:true}
      stale-after: ${STOCKER_PRICING_ON_DEMAND_STALE_AFTER:PT26H}
      deadline: ${STOCKER_PRICING_ON_DEMAND_DEADLINE:PT0S}
      category-cooldown: ${STOCKER_PRICING_ON_DEMAND_COOLDOWN:PT30M}
      max-page-loads-per-chain-per-hour: ${STOCKER_PRICING_ON_DEMAND_MAX_PER_HOUR:20}
    # Price lookups are answered from an in-memory copy of normalized_products (one query per ttl, refreshed in the
    # background) instead of several database round trips per lookup. ttl=PT0S turns it off.
    snapshot:
      ttl: ${STOCKER_PRICING_SNAPSHOT_TTL:PT30S}
      refresh-interval: ${STOCKER_PRICING_SNAPSHOT_REFRESH_INTERVAL:PT15S}
    match:
      # false = comparing a list reads stored prices only (no third-party provider call on the request path).
      provider-fallback: ${STOCKER_PRICING_MATCH_PROVIDER_FALLBACK:false}
      # false = a search that finds nothing is only recorded (unmatched_search_terms); it never starts a scrape.
      on-demand-ingest: ${STOCKER_PRICING_MATCH_ON_DEMAND_INGEST:false}
    cache:
      # How long a price_records row is considered fresh enough to skip a live re-fetch.
      # Long by design: IngestScheduler's nightly crawl is what should keep this warm.
      freshness-window: ${STOCKER_PRICING_CACHE_FRESHNESS_WINDOW:PT24H}
      # In-process L1 TTL - short, just to absorb request bursts for the same item.
      l1-ttl: ${STOCKER_PRICING_CACHE_L1_TTL:PT5M}
    fallback:
      # Tight timeout for the synchronous cache-miss fallback call to the active WebFetcher -
      # deliberately shorter than app.fetch.timeout-seconds, which governs the underlying
      # WebClient call itself. On timeout/failure, the fallback gives up and defers to the
      # async refresh queue instead of blocking the gRPC caller further.
      timeout: ${STOCKER_PRICING_FALLBACK_TIMEOUT:PT3S}
    refresh:
      topic: ${STOCKER_PRICING_REFRESH_TOPIC:stocker.pricing.refresh-requests.v1}
  service-area:
    # Placeholder region list - needs product/team sign-off on the real supported-region set
    # before this ships. Matched case-insensitively by ServiceAreaProperties.isSupported.
    supported-regions: ${STOCKER_SERVICE_AREA_SUPPORTED_REGIONS:auckland,wellington,christchurch}
  fulfilment:
    # Per-chain cost of getting the groceries, added to the items total when comparing chains
    # (docs/features/fulfilment-costs.md).
    # source: supplied by the owner 2026-10-19; check against the supermarkets' sites
    # Ladders: the tier with the greatest `from` <= the items total applies (boundary inclusive: a total exactly
    # equal to `from` gets that tier). Omitted/empty ladder = method not offered. `islands.<north|south>` overrides
    # a chain's delivery and/or click-and-collect ladder for regions on that island.
    # Not modelled: New World Express Delivery, date-dependent surcharges, store-specific fees, Club+ requirement.
    region-islands:
      auckland: north
      wellington: north
      christchurch: south
    chains:
      newworld:
        delivery:
          - { from: 0, fee: 14.00 }
          - { from: 200, fee: 9.00 }
        click-and-collect:
          - { from: 0, fee: 5.00 }
          - { from: 50, fee: 0.00 }
        islands:
          south:
            delivery:
              - { from: 0, fee: 15.00 }
              - { from: 200, fee: 10.00 }
            click-and-collect:
              - { from: 0, fee: 3.50 }
      paknsave:
        # Delivery is not offered (no delivery key). Same-day collection ($9) and "free over $150 at select
        # stores" are not modelled (store-specific / premium).
        click-and-collect:
          - { from: 0, fee: 5.00 }
      woolworths:
        # Not modelled: app promotions, the Sunday/public-holiday surcharge (+$2), the mid-week 6-hour window,
        # 90-minute "Delivery Now" ($19) and the $1.50 paper-bag fee.
        delivery:
          - { from: 0, fee: 14.00 }
          - { from: 200, fee: 9.00 }
        click-and-collect:
          - { from: 0, fee: 3.50 }
