spring:
  application:
    name: pricing
  lifecycle:
    timeout-per-shutdown-phase: 10s
  datasource:
    url: ${STOCKER_DB_URL:jdbc:postgresql://localhost:5432/pricing}
    username: ${STOCKER_DB_USER:stocker}
    password: ${STOCKER_DB_PASSWORD:stocker}
    hikari:
      maximum-pool-size: 10
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  # TODO: gRPC server is not started. Add a spring.grpc.server section (e.g. port: ${SERVER_PORT:8084})
  # once the Spring gRPC server starter is added to build.gradle.
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: stocker.pricing
      enable-auto-commit: false
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

server:
  port: ${SERVER_PORT:8084}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus

app:
  # TODO: the topics below are configured but unused — no @KafkaListener and no producer exist yet.
  # Create (currently missing, to match the other services' hexagonal layout):
  #   application/PricingEventService.java
  #   domain/port/EventPublisher.java
  #   infrastructure/messaging/KafkaEventPublisher.java
  #   infrastructure/messaging/KafkaEventConsumer.java  (consumes stocker.catalog.events.v1)
  # and keep the topic names aligned with infra/kafka/topics.yml.
  kafka:
    producer:
      topics:
        promotions: stocker.promotions.events.v1
        pricing: stocker.pricing.events.v1
    consumer:
      topics: stocker.catalog.events.v1
