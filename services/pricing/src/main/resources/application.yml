spring:
  application:
    name: pricing
  lifecycle:
    timeout-per-shutdown-phase: 10s
  datasource:
    url: ${STOCKER_DB_URL:jdbc:postgresql://localhost:5432/pricing}
    username: ${STOCKER_DB_USER:stocker}
    password: ${STOCKER_DB_PASSWORD:stocker}
    # Sized for Neon (serverless Postgres): compute auto-suspends when idle and drops its connections,
    # so keep no idle connections, retire them before Neon does, and allow for a cold start.
    hikari:
      maximum-pool-size: ${STOCKER_DB_POOL_SIZE:10}
      minimum-idle: 0
      idle-timeout: 120000
      max-lifetime: 240000
      connection-timeout: 30000
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  # Neon recommends the DIRECT endpoint (same host without "-pooler") for migrations, because the pooled
  # endpoint does not support session-level features. V1-V4 did apply through the pooler here, so this is a
  # precaution: set STOCKER_DB_MIGRATE_URL to use it; when unset Flyway uses the application datasource.
  flyway:
    enabled: true
    url: ${STOCKER_DB_MIGRATE_URL:${STOCKER_DB_URL:jdbc:postgresql://localhost:5432/pricing}}
    user: ${STOCKER_DB_MIGRATE_USER:${STOCKER_DB_USER:stocker}}
    password: ${STOCKER_DB_MIGRATE_PASSWORD:${STOCKER_DB_PASSWORD:stocker}}
  grpc:
    server:
      port: ${STOCKER_GRPC_SERVER_PORT:9094}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: stocker.pricing
      enable-auto-commit: false
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

server:
  port: ${SERVER_PORT:8084}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus

app:
  fetch:
    provider: ${STOCKER_FETCH_PROVIDER:spread}
    timeout-seconds: 30
    spread:
      base-url: ${STOCKER_SPREAD_BASE_URL:https://spread.butterup.app/spread-api/v1}
      api-key: ${STOCKER_SPREAD_API_KEY:}
    serpapi:
      base-url: https://serpapi.com/search
      api-key: ${STOCKER_SERPAPI_KEY:}
      country: nz
    scrapingbee:
      base-url: https://app.scrapingbee.com/api/v1
      api-key: ${STOCKER_SCRAPINGBEE_KEY:}
    scraperapi:
      base-url: https://api.scraperapi.com
      api-key: ${STOCKER_SCRAPERAPI_KEY:}
    rapidapi:
      base-url: ${STOCKER_RAPIDAPI_BASE_URL:https://woolworths-products-api.p.rapidapi.com}
      host: ${STOCKER_RAPIDAPI_HOST:woolworths-products-api.p.rapidapi.com}
      endpoint: ${STOCKER_RAPIDAPI_ENDPOINT:/woolworths/product-search/}
      price-changes-endpoint: ${STOCKER_RAPIDAPI_PRICE_CHANGES_ENDPOINT:/woolworths/price-changes/}
      api-key: ${STOCKER_RAPIDAPI_KEY:}
      query-param: query
      limit: 50
    culture-stores:
      - name: Tai Ping
        url: https://www.taiping.co.nz
        chain: taiping
      - name: Lim Chhour
        url: https://www.limchhour.co.nz
        chain: limchhour
      - name: Goldenresult
        url: https://www.goldenresult.co.nz
        chain: goldenresult
  ingest:
    # Starting scope: milk only, across all three chains - the one category already verified
    # end-to-end live (see INGEST_MODULE.md Day-1 checklist). dry-run stays true until a run
    # against it shows realistic counts with no zeroResultCategoryUrls/warnings.
    enabled: ${STOCKER_INGEST_ENABLED:true}
    dry-run: ${STOCKER_INGEST_DRY_RUN:true}
    # Once a day at 03:00 Auckland time, covering every configured category, regardless of the container's timezone.
    cron: ${STOCKER_INGEST_CRON:0 0 3 * * *}
    cron-zone: ${STOCKER_INGEST_CRON_ZONE:Pacific/Auckland}
    # One extra run right after startup (database + scraping); off by default, used to seed fresh data.
    run-on-startup: ${STOCKER_INGEST_RUN_ON_STARTUP:false}
    navigation-timeout-seconds: 30
    max-pages-per-category: ${STOCKER_INGEST_MAX_PAGES_PER_CATEGORY:8}
    sitemap-cache-ttl-days: ${STOCKER_INGEST_SITEMAP_CACHE_TTL_DAYS:7}
    # Rate limiting: a random pause between two page loads on the same chain, and a cap on category
    # pages per chain per run (the rest are visited on following days).
    page-delay-min-millis: ${STOCKER_INGEST_PAGE_DELAY_MIN_MILLIS:20000}
    page-delay-max-millis: ${STOCKER_INGEST_PAGE_DELAY_MAX_MILLIS:40000}
    # (20-40 s since 2026-10-20: 4-9 s drew a run of HTTP 429 from New World.) A chain below can override its own pace:
    # app.ingest.<chain>.page-delay-min/max-millis (empty = use the shared values above).
    # Circuit breaker per chain: this many consecutive blocked responses (429 / 403 / 503 / captcha) stop the chain's run and
    # open it for breaker-cooldown (doubling on each consecutive trip up to breaker-max-cooldown); in memory.
    breaker-blocked-threshold: ${STOCKER_INGEST_BREAKER_BLOCKED_THRESHOLD:3}
    breaker-cooldown: ${STOCKER_INGEST_BREAKER_COOLDOWN:PT6H}
    breaker-max-cooldown: ${STOCKER_INGEST_BREAKER_MAX_COOLDOWN:PT24H}
    max-categories-per-run: ${STOCKER_INGEST_MAX_CATEGORIES_PER_RUN:0}
    # Hard cap on category pages per chain per Auckland day (scheduled run + on-demand refresh together).
    max-pages-per-chain-per-day: ${STOCKER_INGEST_MAX_PAGES_PER_CHAIN_PER_DAY:140}
    # Pages held back from the first pages of the list for the further pages of multi-page categories (?pg=2,3,...).
    extra-pages-reserve-per-run: ${STOCKER_INGEST_EXTRA_PAGES_RESERVE_PER_RUN:20}
    # A page crawled less than this many hours ago goes to the back of the daily queue.
    recrawl-freshness-hours: ${STOCKER_INGEST_RECRAWL_FRESHNESS_HOURS:20}
    # Add sitemap category pages that match a staple keyword (unverified; dead ones are quarantined by the crawl).
    staple-discovery-enabled: ${STOCKER_INGEST_STAPLE_DISCOVERY_ENABLED:true}
    max-discovered-pages-per-chain: ${STOCKER_INGEST_MAX_DISCOVERED_PAGES_PER_CHAIN:40}
    # A page with this many zero-product runs in a row is skipped for quarantine-days, then retried once (in memory).
    quarantine-after-zero-runs: ${STOCKER_INGEST_QUARANTINE_AFTER_ZERO_RUNS:2}
    quarantine-days: ${STOCKER_INGEST_QUARANTINE_DAYS:7}
    quarantine-site-wide-zero-share: ${STOCKER_INGEST_QUARANTINE_SITE_WIDE_ZERO_SHARE:0.5}
