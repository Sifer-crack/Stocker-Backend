plugins {
	id 'com.google.protobuf' version '0.9.4'
}

description = 'pricing: promotions and pricing (PostgreSQL + JSONB)'

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	implementation 'org.springframework.boot:spring-boot-starter-webflux'
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-kafka'
	implementation 'org.flywaydb:flyway-database-postgresql'

	//  gRPC-Java https://github.com/grpc/grpc-java
	// TODO: the gRPC server is not actually started — only the low-level io.grpc libs below are
	// present, so PriceRecordServiceImplBase is never bound to a listener. Add the Spring gRPC
	// server starter and configure spring.grpc.server.port. Requires approval: root AGENT.md pins
	// the dependency set (springGrpcVersion lives in the root build.gradle).
	// TODO: add an in-process gRPC test dependency (e.g. io.grpc:grpc-inprocess or
	// io.grpc:grpc-testing) before writing gRPC controller tests.
	runtimeOnly 'io.grpc:grpc-netty-shaded:1.83.1'
	implementation 'io.grpc:grpc-protobuf:1.83.1'
	implementation 'io.grpc:grpc-stub:1.83.1'
	implementation 'javax.annotation:javax.annotation-api:1.3.2'

	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'

	runtimeOnly 'org.postgresql:postgresql'
	runtimeOnly 'io.micrometer:micrometer-registry-prometheus'

	//  Playwright for Java https://playwright.dev/java/ - used by ingest/ for self-built
	//  supermarket scraping (New World / PAK'nSave / Woolworths NZ have no public JSON API).
	implementation 'com.microsoft.playwright:playwright:1.63.0'

	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testCompileOnly 'org.projectlombok:lombok'
	testAnnotationProcessor 'org.projectlombok:lombok'
}

// Downloads the Playwright Firefox binary for local dev/CI use of the ingest/ module.
// Not wired into build/test/bootJar - plain `./gradlew build` never needs network/Firefox.
// Firefox, not Chromium: verified against the live sites - see PlaywrightConfig javadoc.
tasks.register('installPlaywrightBrowsers', JavaExec) {
	group = 'ingest'
	description = "Downloads the Playwright Firefox binary (app.ingest.* module)."
	classpath = sourceSets.main.runtimeClasspath
	mainClass = 'com.microsoft.playwright.CLI'
	args = ['install', 'firefox']
}

// Make root .env vars (STOCKER_SPREAD_API_KEY, STOCKER_DB_URL, ...) visible to tests.
tasks.named('test') {
	environment.putAll(readDotEnv(new File("${rootDir}/.env")))
}

def readDotEnv(File file) {
	def env = [:]
	if (file.exists()) {
		file.readLines().each { raw ->
			def line = raw.trim()
			if (line && !line.startsWith('#') && line.indexOf('=') > 0) {
				def eq = line.indexOf('=')
				def key = line.substring(0, eq).trim()
				def value = line.substring(eq + 1).trim()
				if (value.length() >= 2 && value.startsWith('"') && value.endsWith('"')) {
					value = value.substring(1, value.length() - 1)
				}
				env[key] = value
			}
		}
	}
	return env
}

protobuf {
	protoc {
		artifact = 'com.google.protobuf:protoc:3.25.9'
	}
	plugins {
		grpc {
			artifact = 'io.grpc:protoc-gen-grpc-java:1.83.1'
		}
	}
	generateProtoTasks {
		all()*.plugins {
			grpc {}
		}
	}
}
